<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 44" width="760" height="44" role="img" aria-label="React Native Developer highlights">
  <style>
    .t { font-family: "Fira Code", "SF Mono", Consolas, monospace; font-size: 19px; font-weight: 600; fill: #2563eb; }
    .a { fill: #0ea5e9; }
  </style>
  <g text-anchor="middle">
    <text class="t" x="380" y="28" opacity="0">React Native Developer  |  4.5+ years
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.17;0.2" dur="15s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="380" y="28" opacity="0">React Native &#8226; TypeScript &#8226; Redux Toolkit
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.17;0.2" dur="15s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="380" y="28" opacity="0">12+ cross-platform apps in production
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.17;0.2" dur="15s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text class="t" x="380" y="28" opacity="0">25% faster loads &#8226; 30% fewer crashes
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.17;0.2" dur="15s" begin="9s" repeatCount="indefinite"/>
    </text>
    <text class="t a" x="380" y="28" opacity="0">Open for freelance &amp; contract work!
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.03;0.17;0.2" dur="15s" begin="12s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
